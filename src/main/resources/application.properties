# ====================================================================
# Smart Canteen Queue & Food Ordering System
# Main Configuration
# ====================================================================

# Default active profile ('dev' uses in-memory H2 with seed data; 'mysql' connects to MySQL)
spring.profiles.default=dev

# Server Port
server.port=${SERVER_PORT:8080}
spring.application.name=SmartCanteen

# Jackson JSON Settings
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Canteen Smart Queue Estimator Parameters
canteen.queue.kitchen-concurrency=${CANTEEN_KITCHEN_CONCURRENCY:2}
canteen.queue.default-item-prep-minutes=${CANTEEN_DEFAULT_ITEM_PREP_MINUTES:5}
canteen.queue.min-wait-minutes=3

# Admin Security Configuration (Demo Mode for College Hackathon)
canteen.admin.demo-secret=${ADMIN_DEMO_SECRET:smart-admin-secret-2026}
